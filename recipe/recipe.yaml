schema_version: 1

context:
  name: chart-studio
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a17283b62470306d77060b200f13f9749c807dd15613c113d36f8d057f5c7019

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - plotly
    - requests
    - retrying >=1.3.3
    - six

tests:
  - python:
      imports:
        - chart_studio
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: This package contains utilities for interfacing with Plotly's Chart Studio service
  homepage: https://github.com/plotly/plotly.py
  repository: https://github.com/plotly/plotly.py/tree/master/packages/python/chart-studio
  documentation: https://help.plot.ly/tutorials/#fundamentals

extra:
  recipe-maintainers:
    - jonmmease
    - timkpaine
    - dhirschfeld
    - nicolaskruchten
    - emmanuelle
